[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
source = .
omit =
    tests/*
    schema/*
    setup_database.py
    migrate_data.py

[coverage:report]
exclude_also =
    pragma: no cover
    def run_streamlit
    def _render_assistant_message
    def run_cli
    if _is_running_in_streamlit
    if __name__
    if sys.platform
    if "--streamlit" in sys.argv
show_missing = true
fail_under = 98
